<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:asset.css
        identifier="academic-persons-edit-profile-editing"
        href="EXT:academic_persons_edit/Resources/Public/Css/frontend/profile-editing.css" />

    <section
        class="academic-persons-edit academic-persons-profile-editing-list"
        aria-labelledby="academic-persons-profile-editing-list-heading"
        data-academic-persons-profile-editing-list>
        <h1 id="academic-persons-profile-editing-list-heading" class="h2 fw-normal mb-4">
            <f:translate
                key="list.profile.assigned"
                extensionName="academic_persons_edit" />
        </h1>

        <f:if condition="{profileListItems}">
            <f:then>
                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">
                                    <f:translate
                                        key="list.profile"
                                        extensionName="academic_persons_edit" />
                                </th>
                                <th scope="col">
                                    <f:translate
                                        key="list.language"
                                        extensionName="academic_persons_edit" />
                                </th>
                                <th scope="col" class="text-end">
                                    <f:translate
                                        key="list.actions"
                                        extensionName="academic_persons_edit" />
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{profileListItems}" as="item">
                                <f:variable
                                    name="profile"
                                    value="{item.profile}" />
                                <tr>
                                    <td>
                                        <div
                                            class="d-flex align-items-center gap-3">
                                            <f:if condition="{profile.image}">
                                                <f:then>
                                                    <f:image
                                                        image="{profile.image}"
                                                        width="80c"
                                                        height="80c"
                                                        class="academic-persons-profile-editing-list__image flex-shrink-0 object-fit-cover"
                                                        alt="" />
                                                </f:then>
                                                <f:else>
                                                    <img
                                                        src="{f:uri.resource(path: 'Images/profile-placeholder.png')}"
                                                        width="80"
                                                        height="80"
                                                        class="academic-persons-profile-editing-list__image flex-shrink-0 object-fit-cover"
                                                        alt="" />
                                                </f:else>
                                            </f:if>
                                            <span class="fw-medium text-break">
                                                {profile.title}
                                                {profile.firstName}
                                                {profile.middleName}
                                                {profile.lastName}
                                            </span>
                                        </div>
                                    </td>
                                    <td class="text-nowrap">{item.language}</td>
                                    <td class="text-end text-nowrap">
                                        <div
                                            class="d-inline-flex flex-wrap justify-content-end gap-2">
                                            <f:link.action
                                                pageUid="{settings.detailPid}"
                                                action="detail"
                                                arguments="{profile: profile}"
                                                pluginName="Detail"
                                                controller="Profile"
                                                aria-label="{f:translate(key:
                                                'actions.view', extensionName:
                                                'academic_persons_edit')}"
                                                title="{f:translate(key:
                                                'actions.view', extensionName:
                                                'academic_persons_edit')}"
                                                extensionName="academicpersons"
                                                class="btn rounded-0 btn-link">
                                                <core:icon
                                                    identifier="academic-persons-edit-view"
                                                    alternativeMarkupIdentifier="inline" />
                                            </f:link.action>
                                            <f:link.action
                                                action="index"
                                                controller="Profile"
                                                arguments="{profileUid: profile.uid}"
                                                aria-label="{f:translate(key:
                                                'actions.edit', extensionName:
                                                'academic_persons_edit')}"
                                                title="{f:translate(key:
                                                'actions.edit', extensionName:
                                                'academic_persons_edit')}"
                                                class="btn rounded-0 btn-link">
                                                <core:icon
                                                    identifier="academic-persons-edit-edit"
                                                    alternativeMarkupIdentifier="inline" />
                                            </f:link.action>
                                        </div>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <p class="mb-0">
                    <f:translate
                        key="list.noProfilesFound"
                        extensionName="academic_persons_edit" />
                </p>
            </f:else>
        </f:if>
    </section>
</html>
