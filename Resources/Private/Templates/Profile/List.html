<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <section
        class="academic-persons-edit academic-persons-profile-editing-list"
        aria-labelledby="academic-persons-profile-editing-list-heading"
        data-academic-persons-profile-editing-list>
        <h1 id="academic-persons-profile-editing-list-heading" class="ace-title">
            <f:translate
                key="list.profile.assigned"
                extensionName="AcademicPersonsEdit" />
        </h1>

        <f:if condition="{profileListItems}">
            <f:then>
                <div class="ace-table-wrap">
                    <table class="ace-table">
                        <thead class="ace-header">
                            <tr>
                                <th class="ace-label" scope="col">
                                    <f:translate
                                        key="list.profile"
                                        extensionName="AcademicPersonsEdit" />
                                </th>
                                <th class="ace-label" scope="col">
                                    <f:translate
                                        key="list.language"
                                        extensionName="AcademicPersonsEdit" />
                                </th>
                                <th scope="col" class="ace-label ace-actions">
                                    <f:translate
                                        key="list.actions"
                                        extensionName="AcademicPersonsEdit" />
                                </th>
                            </tr>
                        </thead>
                        <tbody class="ace-content">
                            <f:for each="{profileListItems}" as="item">
                                <f:variable
                                    name="profile"
                                    value="{item.profile}" />
                                <tr class="ace-item">
                                    <td class="ace-value">
                                        <div
                                            class="ace-profile">
                                            <f:if condition="{profile.image}">
                                                <f:then>
                                                    <f:image
                                                        image="{profile.image}"
                                                        width="80c"
                                                        height="80c"
                                                        class="ace-image"
                                                        alt="" />
                                                </f:then>
                                                <f:else>
                                                    <img
                                                        src="{f:uri.resource(path: 'Images/profile-placeholder.png')}"
                                                        width="80"
                                                        height="80"
                                                        class="ace-image"
                                                        alt="" />
                                                </f:else>
                                            </f:if>
                                            <span class="ace-title ace-name">
                                                {profile.title}
                                                {profile.firstName}
                                                {profile.middleName}
                                                {profile.lastName}
                                            </span>
                                            <f:if condition="{profile.hidden}">
                                                <span
                                                    class="ace-state"
                                                    data-pe-profile-hidden>
                                                    <f:translate
                                                        key="list.profile.hidden"
                                                        extensionName="AcademicPersonsEdit" />
                                                </span>
                                            </f:if>
                                        </div>
                                    </td>
                                    <td class="ace-value ace-language">{item.language}</td>
                                    <td class="ace-actions">
                                        <div
                                            class="ace-controls">
                                            <f:comment>
                                                A hidden profile has no public detail
                                                page, so it gets no link to one.
                                            </f:comment>
                                            <f:if condition="!{profile.hidden}">
                                                <f:link.action
                                                    pageUid="{settings.detailPid}"
                                                    action="detail"
                                                    arguments="{profile: profile}"
                                                    pluginName="Detail"
                                                    controller="Profile"
                                                    aria-label="{f:translate(key:
                                                    'actions.view', extensionName:
                                                    'AcademicPersonsEdit')}"
                                                    title="{f:translate(key:
                                                    'actions.view', extensionName:
                                                    'AcademicPersonsEdit')}"
                                                    extensionName="academicpersons"
                                                    class="ace-link ace-control ace-view btn btn-link">
                                                    <ab:icon
                                                        identifier="tx-academicbase-action-view"
                                                        alternativeMarkupIdentifier="inline" />
                                                </f:link.action>
                                            </f:if>
                                            <f:link.action
                                                action="index"
                                                controller="Profile"
                                                arguments="{profileUid: profile.uid}"
                                                aria-label="{f:translate(key:
                                                'actions.edit', extensionName:
                                                'AcademicPersonsEdit')}"
                                                title="{f:translate(key:
                                                'actions.edit', extensionName:
                                                'AcademicPersonsEdit')}"
                                                class="ace-link ace-control ace-edit btn btn-link">
                                                <ab:icon
                                                    identifier="tx-academicbase-action-edit"
                                                    alternativeMarkupIdentifier="inline" />
                                            </f:link.action>
                                        </div>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <p class="ace-empty">
                    <f:translate
                        key="list.noProfilesFound"
                        extensionName="AcademicPersonsEdit" />
                </p>
            </f:else>
        </f:if>
    </section>
</html>
