<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <article
        class="ace-item"
        data-pe-document-item
        data-item-uid="{contract.uid}"
        data-item-sorting="{contract.sorting}"
        data-item-position="{itemIteration.index}"
        {f:if(condition: contract.hidden, then: 'data-item-hidden="1"')}>
        <div class="row">
        <f:for each="{rowFields}" as="rowField">
            <f:switch expression="{rowField}">
                <f:case value="from">
                    <div class="col-12 col-md-2">
                        <div class="ace-cell">
                        <div class="ace-label">
                            <f:translate key="profileEditing.documents.from" extensionName="AcademicPersonsEdit" />
                        </div>
                        <div class="ace-value" data-pe-document-value="validFrom">
                            <f:if condition="{contract.validFrom}">
                                <f:then><f:format.date date="{contract.validFrom}" pattern="MEDIUMDATE" /></f:then>
                                <f:else>—</f:else>
                            </f:if>
                        </div>
                        </div>
                    </div>
                </f:case>
                <f:case value="to">
                    <div class="col-12 col-md-2">
                        <div class="ace-cell">
                        <div class="ace-label">
                            <f:translate key="profileEditing.documents.to" extensionName="AcademicPersonsEdit" />
                        </div>
                        <div class="ace-value" data-pe-document-value="validTo">
                            <f:if condition="{contract.validTo}">
                                <f:then><f:format.date date="{contract.validTo}" pattern="MEDIUMDATE" /></f:then>
                                <f:else>—</f:else>
                            </f:if>
                        </div>
                        </div>
                    </div>
                </f:case>
                <f:case value="position">
                    <div class="col-12 col-md">
                        <div class="ace-cell">
                        <div class="ace-label">
                            <f:translate key="profileEditing.documents.position" extensionName="AcademicPersonsEdit" />
                        </div>
                        <div class="ace-value" data-pe-document-value="position">
                            <f:if condition="{contract.position}">
                                <f:then>{contract.position}</f:then>
                                <f:else>—</f:else>
                            </f:if>
                        </div>
                        </div>
                    </div>
                </f:case>
            </f:switch>
        </f:for>
        <f:render partial="Profile/Documents/Actions" arguments="{actions: actions, sortable: sortable, hidden: contract.hidden, managed: managed}" />
        <div class="col-12"><div class="ace-collapse" data-pe-document-item-collapse-target></div></div>
        </div>
    </article>
</html>
