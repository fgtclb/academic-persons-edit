<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div class="ace-content" data-pe-document-sections>
        <f:variable
            name="defaultEmptyMessage"
            value="{f:translate(
                key: 'profileEditing.documents.empty',
                extensionName: 'AcademicPersonsEdit',
            )}" />
        <f:for each="{sections}" as="section">
            <section
                class="ace-section"
                aria-labelledby="profile-editing-{profile.uid}-document-section-{section.identifier}-heading"
                data-pe-document-section
                data-section-key="{section.identifier}"
                data-section-field-name="{section.fieldName}"
                data-section-record-type="{section.type}"
                data-section-readonly="{f:if(condition: section.readOnly, then: '1', else: '0')}"
                data-section-sortable="{f:if(condition: section.sortable, then: '1', else: '0')}"
                data-section-position="{section.position}"
                data-section-kind="{section.kind}">
                <div
                    class="ace-header"
                    data-pe-document-section-header>
                    <h2
                        id="profile-editing-{profile.uid}-document-section-{section.identifier}-heading"
                        class="ace-title">
                        <f:translate
                            key="{section.label}"
                            default="{section.identifier}"
                            extensionName="AcademicPersonsEdit" />
                    </h2>
                    <f:if condition="{section.canCreate}">
                        <button
                            type="button"
                            class="ace-control ace-add btn btn-sm btn-link"
                            aria-expanded="false"
                            data-pe-document-add>
                            <ab:icon
                                identifier="tx-academicbase-action-add"
                                size="small"
                                alternativeMarkupIdentifier="inline" />
                            <span class="visually-hidden">
                                <f:translate
                                    key="actions.add"
                                    extensionName="AcademicPersonsEdit" />
                            </span>
                        </button>
                    </f:if>
                </div>
                <div data-pe-document-add-collapse-target></div>
                <f:switch expression="{section.kind}">
                    <f:case value="contract">
                        <f:render
                            partial="Profile/Documents/Contract"
                            arguments="{items: section.items, rowFields: section.rowFields, actions: section.actions, rowActions: section.rowActions, managedItems: section.managedItems, sortable: section.sortable}" />
                    </f:case>
                    <f:case value="profileInformation">
                        <f:render
                            partial="Profile/Documents/ProfileInformation"
                            arguments="{items: section.items, rowFields: section.rowFields, actions: section.actions, sortable: section.sortable}" />
                    </f:case>
                </f:switch>
                <div
                    class="ace-empty"
                    role="status"
                    {f:if(condition: '{section.items -> f:count()} > 0', then: 'hidden="hidden"')}
                    data-pe-document-empty-state>
                    <f:translate
                        key="profileEditing.documents.empty.{section.identifier}"
                        extensionName="AcademicPersonsEdit"
                        default="{defaultEmptyMessage}" />
                </div>
            </section>
        </f:for>
    </div>
</html>
