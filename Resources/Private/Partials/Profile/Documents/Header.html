<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div
        class="ace-header ace-label"
        data-pe-document-list-header
        {f:if(condition: '{items -> f:count()} > 0', else: 'hidden="hidden"')}>
        <div class="row">
            <f:for each="{rowFields}" as="rowField">
                <f:switch expression="{rowField}">
                    <f:case value="from">
                        <div class="col-md-2">
                            <div class="ace-value"><f:translate key="profileEditing.documents.from" extensionName="AcademicPersonsEdit" /></div>
                        </div>
                    </f:case>
                    <f:case value="to">
                        <div class="col-md-2">
                            <div class="ace-value"><f:translate key="profileEditing.documents.to" extensionName="AcademicPersonsEdit" /></div>
                        </div>
                    </f:case>
                    <f:case value="year">
                        <div class="col-md-2">
                            <div class="ace-value"><f:translate key="profileEditing.documents.year" extensionName="AcademicPersonsEdit" /></div>
                        </div>
                    </f:case>
                    <f:case value="title">
                        <div class="col">
                            <div class="ace-value"><f:translate key="profileEditing.documents.title" extensionName="AcademicPersonsEdit" /></div>
                        </div>
                    </f:case>
                    <f:case value="position">
                        <div class="col">
                            <div class="ace-value"><f:translate key="profileEditing.documents.position" extensionName="AcademicPersonsEdit" /></div>
                        </div>
                    </f:case>
                    <f:case value="description">
                        <div class="col-12">
                            <div class="ace-value"><f:translate key="profileInformation.bodytext.label" extensionName="AcademicPersonsEdit" /></div>
                        </div>
                    </f:case>
                </f:switch>
            </f:for>
            <div class="col-md-auto">
                <div class="ace-actions"><f:translate key="profileEditing.documents.actionsHeading" extensionName="AcademicPersonsEdit" /></div>
            </div>
        </div>
    </div>
</html>
