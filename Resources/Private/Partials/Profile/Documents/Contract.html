<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:render
        partial="Profile/Documents/Header"
        arguments="{items: items, rowFields: rowFields}" />
    <div class="ace-itemlist" data-pe-document-items>
        <f:for each="{items}" as="contract" iteration="itemIteration">
            <f:comment>
                A contract the synchronisation manages offers no delete, and no
                edit once every editable field of it is managed. A caller that
                passes no rowActions, such as an older override of
                Sections.html, gets the actions of the section.
            </f:comment>
            <f:variable name="contractActions" value="{actions}" />
            <f:if condition="{rowActions}">
                <f:variable name="contractActions" value="{rowActions.{contract.uid}}" />
            </f:if>
            <f:variable name="contractManaged" value="{managedItems.{contract.uid}}" />
            <f:render
                partial="Profile/Documents/ContractRow"
                arguments="{contract: contract, itemIteration: itemIteration, rowFields: rowFields, actions: contractActions, managed: contractManaged, sortable: sortable}" />
        </f:for>
    </div>
    <div hidden="hidden" aria-hidden="true" data-pe-document-item-template>
        <f:render
            partial="Profile/Documents/ContractRow"
            arguments="{template: true, rowFields: rowFields, actions: actions, sortable: sortable}" />
    </div>
</html>
