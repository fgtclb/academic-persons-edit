<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div class="col-12 col-md-auto">
    <div class="ace-actions">
        <span
            class="ace-state"
            data-pe-document-hidden-badge
            {f:if(condition: hidden, else: 'hidden="hidden"')}>
            <f:translate
                key="profileEditing.documents.hidden"
                extensionName="AcademicPersonsEdit" />
        </span>
        <f:if condition="{managed}">
            <span
                class="ace-state"
                data-pe-document-managed-badge>
                <f:translate
                    key="profileEditing.field.managed"
                    extensionName="AcademicPersonsEdit" />
            </span>
        </f:if>
        <div
            class="ace-controls"
            role="group"
            aria-label="{f:translate(key: 'profileEditing.documents.actions', extensionName: 'AcademicPersonsEdit')}"
            data-pe-document-actions>
            <f:if condition="{sortable}">
                <button
                    type="button"
                    class="ace-control ace-sort ace-sort-handle btn btn-sm btn-link"
                    title="{f:translate(key: 'actions.dragSort', extensionName: 'AcademicPersonsEdit')}"
                    aria-label="{f:translate(key: 'actions.dragSort', extensionName: 'AcademicPersonsEdit')}"
                    draggable="true"
                    data-pe-document-drag>
                    <ab:icon
                        identifier="tx-academicbase-action-drag"
                        size="small"
                        alternativeMarkupIdentifier="inline" />
                </button>
            </f:if>
            <f:for each="{actions}" as="action">
                <f:switch expression="{action}">
                    <f:case value="hide">
                        <button
                            type="button"
                            class="ace-control ace-visibility-toggle btn btn-sm btn-link"
                            data-pe-document-hide
                            title="{f:if(condition: hidden, then: '{f:translate(key: \'actions.show\', extensionName: \'AcademicPersonsEdit\')}', else: '{f:translate(key: \'actions.hide\', extensionName: \'AcademicPersonsEdit\')}')}"
                            aria-label="{f:if(condition: hidden, then: '{f:translate(key: \'actions.show\', extensionName: \'AcademicPersonsEdit\')}', else: '{f:translate(key: \'actions.hide\', extensionName: \'AcademicPersonsEdit\')}')}"
                            data-pe-label-visible="{f:translate(key: 'actions.hide', extensionName: 'AcademicPersonsEdit')}"
                            data-pe-label-hidden="{f:translate(key: 'actions.show', extensionName: 'AcademicPersonsEdit')}">
                            <span data-pe-visibility-icon="visible" {f:if(condition: hidden, then: 'hidden="hidden"')}>
                                <ab:icon
                                    identifier="tx-academicbase-state-visible"
                                    size="small"
                                    alternativeMarkupIdentifier="inline" />
                            </span>
                            <span data-pe-visibility-icon="hidden" {f:if(condition: hidden, else: 'hidden="hidden"')}>
                                <ab:icon
                                    identifier="tx-academicbase-state-hidden"
                                    size="small"
                                    alternativeMarkupIdentifier="inline" />
                            </span>
                        </button>
                    </f:case>
                    <f:case value="view">
                        <button
                            type="button"
                            class="ace-control ace-view-toggle btn btn-sm btn-link"
                            title="{f:translate(key: 'actions.view', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.view', extensionName: 'AcademicPersonsEdit')}"
                            aria-expanded="false"
                            data-pe-label-collapsed="{f:translate(key: 'actions.view', extensionName: 'AcademicPersonsEdit')}"
                            data-pe-label-expanded="{f:translate(key: 'actions.viewClose', extensionName: 'AcademicPersonsEdit')}"
                            data-pe-document-view>
                            <span data-pe-view-icon="collapsed">
                                <ab:icon
                                    identifier="tx-academicbase-action-view"
                                    size="small"
                                    alternativeMarkupIdentifier="inline" />
                            </span>
                            <span data-pe-view-icon="expanded" hidden="hidden">
                                <ab:icon
                                    identifier="tx-academicbase-action-view-close"
                                    size="small"
                                    alternativeMarkupIdentifier="inline" />
                            </span>
                        </button>
                    </f:case>
                    <f:case value="down">
                        <button
                            type="button"
                            class="ace-control ace-sort-down btn btn-sm btn-link"
                            title="{f:translate(key: 'actions.sortDown', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.sortDown', extensionName: 'AcademicPersonsEdit')}"
                            data-pe-document-sort="down">
                            <ab:icon
                                identifier="tx-academicbase-action-move-down"
                                size="small"
                                alternativeMarkupIdentifier="inline" />
                        </button>
                    </f:case>
                    <f:case value="up">
                        <button
                            type="button"
                            class="ace-control ace-sort-up btn btn-sm btn-link"
                            title="{f:translate(key: 'actions.sortUp', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.sortUp', extensionName: 'AcademicPersonsEdit')}"
                            data-pe-document-sort="up">
                            <ab:icon
                                identifier="tx-academicbase-action-move-up"
                                size="small"
                                alternativeMarkupIdentifier="inline" />
                        </button>
                    </f:case>
                    <f:case value="delete">
                        <button
                            type="button"
                            class="ace-control ace-delete btn btn-sm btn-link"
                            title="{f:translate(key: 'actions.delete', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.delete', extensionName: 'AcademicPersonsEdit')}"
                            aria-expanded="false"
                            data-pe-document-delete>
                            <ab:icon
                                identifier="tx-academicbase-action-delete"
                                size="small"
                                alternativeMarkupIdentifier="inline" />
                        </button>
                    </f:case>
                    <f:case value="edit">
                        <button
                            type="button"
                            class="ace-control ace-edit btn btn-sm btn-link"
                            title="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}"
                            aria-expanded="false"
                            data-pe-document-edit>
                            <ab:icon
                                identifier="tx-academicbase-action-edit"
                                size="small"
                                alternativeMarkupIdentifier="inline" />
                        </button>
                    </f:case>
                </f:switch>
            </f:for>
        </div>
    </div>
    </div>
</html>
