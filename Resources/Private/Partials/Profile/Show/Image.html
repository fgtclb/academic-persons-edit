<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:pe="http://typo3.org/ns/FGTCLB/AcademicPersonsEdit/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="{profile.image}">
    <f:comment>WebP where the installation allows it, the default format otherwise (TYPO3 v12 does not list webp by default).</f:comment>
    <f:variable name="fileExtension" value="{pe:imageFileExtension(preferred: 'webp')}" />
    <figure>
        <picture>
            <source
                srcset="{f:uri.image(
                    image: profile.image,
                    maxWidth: '390',
                    fileExtension: fileExtension,
                )}"
                media="(min-width: 992px)"
            >
            <source
                srcset="{f:uri.image(
                    image: profile.image,
                    maxWidth: '370',
                    fileExtension: fileExtension,
                )}"
                media="(min-width: 768px)"
            >
            <source
                srcset="{f:uri.image(
                    image: profile.image,
                    maxWidth: '690',
                    fileExtension: fileExtension,
                )}"
                media="(min-width: 576px)"
            >
            <source
                srcset="{f:uri.image(
                    image: profile.image,
                    maxWidth: '535',
                    fileExtension: fileExtension,
                )}"
            >
            <img
                src="{f:uri.image(
                    image: profile.image,
                    maxWidth: 690,
                    fileExtension: fileExtension,
                )}"
                alt="{profile.image.originalResource.alternative}"
                title="{profile.image.originalResource.title}"
                loading="lazy"
            >
        </picture>

        <f:if condition="{profile.image.originalResource.description}">
            <figcaption class="visually-hidden">{profile.image.originalResource.description}</figcaption>
        </f:if>
    </figure>
</f:if>

</html>
