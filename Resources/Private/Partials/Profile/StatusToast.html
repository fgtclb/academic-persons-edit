<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <!--
        Two live regions rather than one: a failed request has to interrupt a
        screen reader, a successful one must not. A region's politeness cannot be
        changed reliably once it is in the accessibility tree, so the assertive
        one exists from the start and the JavaScript picks the region by status.
    -->
    <div class="ace-messages">
        <div
            data-pe-status-toast="status"
            class="ace-message"
            role="status"
            aria-live="polite"
            aria-atomic="true">
            <div class="ace-header">
                <strong class="ace-title" data-pe-status-title></strong>
                <button
                    type="button"
                    class="ace-control ace-close btn-close"
                    data-pe-status-close
                    aria-label="{f:translate(key: 'profileEditing.status.close', extensionName: 'AcademicPersonsEdit')}"></button>
            </div>
            <div class="ace-content" data-pe-status-message></div>
        </div>
        <div
            data-pe-status-toast="alert"
            class="ace-message"
            role="alert"
            aria-live="assertive"
            aria-atomic="true">
            <div class="ace-header">
                <strong class="ace-title" data-pe-status-title></strong>
                <button
                    type="button"
                    class="ace-control ace-close btn-close"
                    data-pe-status-close
                    aria-label="{f:translate(key: 'profileEditing.status.close', extensionName: 'AcademicPersonsEdit')}"></button>
            </div>
            <div class="ace-content" data-pe-status-message></div>
        </div>
    </div>
</html>
