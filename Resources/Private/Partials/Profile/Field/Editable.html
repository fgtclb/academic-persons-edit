<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:variable
        name="elementId"
        value="profile-editing-{profile.uid}-{field.identifier}" />
    <div class="col-12">
        <div class="ace-field-group {rowClass}" data-pe-field-wrapper>
            <f:render
                partial="Profile/Field/Preview"
                arguments="{
                    profile: profile,
                    field: field,
                    elementId: elementId,
                    richText: richText
                }" />
            <div
                id="{elementId}-editor"
                class="ace-editor"
                hidden="hidden"
                data-pe-field-editor
                data-pe-for="{elementId}">
                <f:if condition="{richText}">
                    <f:then>
                        <div
                            class="ace-header"
                            data-pe-rich-text-heading>
                            <label
                                class="ace-label"
                                for="{elementId}">
                                <f:translate
                                    key="profile.{field.identifier}.label"
                                    extensionName="AcademicPersonsEdit" />
                                <f:if condition="{field.validation.required}">
                                    <abbr title="{f:translate(key: 'profileEditing.field.required', extensionName: 'AcademicPersonsEdit')}">*</abbr>
                                </f:if>
                            </label>
                            <f:render
                                partial="Profile/Field/Helptext"
                                arguments="{
                                    helptext: field.helptext,
                                    labelKey: field.labelKey,
                                    elementId: elementId
                                }" />
                            <f:if
                                condition="!{field.validation.disabled} && !{field.validation.readOnly}">
                                <f:render
                                    partial="Profile/Field/Actions"
                                    arguments="{elementId: elementId, besideHeading: true}" />
                            </f:if>
                        </div>
                        <div class="ace-control-wrap" data-pe-editor-container>
                            <f:render
                                partial="Profile/Field/Control"
                                arguments="{
                                    profile: profile,
                                    field: field,
                                    elementId: elementId,
                                    control: 'richText',
                                    rows: rows
                                }" />
                            <f:if condition="{field.validation.characterLimit}">
                                <div
                                    id="{elementId}-character-counter"
                                    class="ace-counter"
                                    aria-live="polite"
                                    data-pe-character-counter
                                    data-pe-for="{elementId}">
                                    0 / {field.validation.characterLimit}
                                </div>
                            </f:if>
                        </div>
                    </f:then>
                    <f:else>
                        <div class="ace-header">
                            <label class="ace-label" for="{elementId}">
                                <f:translate
                                    key="profile.{field.identifier}.label"
                                    extensionName="AcademicPersonsEdit" />
                                <f:if condition="{field.validation.required}">
                                    <abbr title="{f:translate(key: 'profileEditing.field.required', extensionName: 'AcademicPersonsEdit')}">*</abbr>
                                </f:if>
                            </label>
                            <f:render
                                partial="Profile/Field/Helptext"
                                arguments="{
                                    helptext: field.helptext,
                                    labelKey: field.labelKey,
                                    elementId: elementId
                                }" />
                        </div>
                        <div class="ace-controls" data-pe-field-control-group>
                            <f:if condition="{textarea}">
                                <f:then>
                                    <div
                                        class="ace-control-wrap"
                                        data-pe-editor-container>
                                        <f:render
                                            partial="Profile/Field/Control"
                                            arguments="{
                                                profile: profile,
                                                field: field,
                                                elementId: elementId,
                                                control: 'textarea',
                                                rows: rows
                                            }" />
                                    </div>
                                </f:then>
                                <f:else>
                                    <f:render
                                        partial="Profile/Field/Control"
                                        arguments="{
                                            profile: profile,
                                            field: field,
                                            elementId: elementId,
                                            control: 'input'
                                        }" />
                                </f:else>
                            </f:if>
                            <f:if
                                condition="!{field.validation.disabled} && !{field.validation.readOnly}">
                                <f:render
                                    partial="Profile/Field/Actions"
                                    arguments="{elementId: elementId, besideHeading: false}" />
                            </f:if>
                        </div>
                    </f:else>
                </f:if>
                <div
                    id="{elementId}-error"
                    class="ace-message"
                    role="alert"></div>
            </div>
        </div>
    </div>
</html>
