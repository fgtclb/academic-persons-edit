<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:variable
        name="groupElementId"
        value="profile-editing-{profile.uid}-{identifier}-group" />
    <div
        class="col-12"
        data-pe-field-group
        data-pe-field-ids="{fieldIds}"
        data-pe-display-field-ids="{displayFieldIds}"
        data-pe-display-mode="{displayMode}">
        <div class="rounded-1 p-3 p-lg-4 {rowClass}">
            <div class="d-flex align-items-start gap-3" data-pe-group-preview>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="fw-semibold d-flex flex-row align-items-center">
                        <f:translate
                            key="{labelKey}"
                            extensionName="AcademicPersonsEdit" />
                    </div>
                    <div
                        class="text-break"
                        data-pe-group-preview-content
                        data-empty-label="{f:translate(key: 'profileEditing.field.empty', extensionName: 'AcademicPersonsEdit')}">
                        <f:for
                            each="{displayFields}"
                            as="field"
                            iteration="fieldIteration">
                            {profile.{field.propertyName}}<f:if
                                condition="!{fieldIteration.isLast}">
                            </f:if>
                        </f:for>
                    </div>
                </div>
                <button
                    class="btn rounded-0 btn-sm border-0 p-1 text-body flex-shrink-0"
                    data-pe-group-edit
                    type="button"
                    aria-controls="profile-editing-{profile.uid}-{identifier}-group-editor"
                    aria-expanded="false"
                    title="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}"
                    aria-label="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}">
                    <core:icon
                        identifier="academic-persons-edit-edit"
                        size="small"
                        alternativeMarkupIdentifier="inline" />
                </button>
            </div>
            <div
                id="profile-editing-{profile.uid}-{identifier}-group-editor"
                class="d-none mt-3"
                data-pe-group-editor>
                <div class="row g-3">
                    <f:for each="{fields}" as="field">
                        <f:variable
                            name="elementId"
                            value="profile-editing-{profile.uid}-{field.identifier}" />
                        <div
                            class="{f:if(condition: field.columnClass, then: field.columnClass, else: 'col-12')}"
                            data-pe-group-control>
                            <div class="d-flex align-items-center">
                                <label class="form-label" for="{elementId}">
                                    <f:translate
                                        key="profile.{field.identifier}.label"
                                        extensionName="AcademicPersonsEdit" />
                                    <f:if condition="{field.validation.required}"
                                        ><abbr title="{f:translate(key: 'profileEditing.field.required', extensionName: 'AcademicPersonsEdit')}">*</abbr></f:if
                                    >
                                </label>
                                <f:render
                                    partial="Profile/Field/Helptext"
                                    arguments="{
                                        helptext: field.helptext,
                                        labelKey: field.labelKey,
                                        elementId: elementId
                                    }" />
                            </div>
                            <f:render
                                partial="Profile/Field/Control"
                                arguments="{profile: profile, field: field, elementId: elementId}" />
                            <div
                                id="{elementId}-error"
                                class="invalid-feedback"
                                role="alert"></div>
                        </div>
                    </f:for>
                </div>
                <div
                    class="d-flex justify-content-end mt-3"
                    data-pe-group-actions>
                    <div
                        class="btn-group btn-group-sm flex-shrink-0"
                        role="group"
                        aria-label="{f:translate(key: 'profileEditing.actions.group', extensionName: 'AcademicPersonsEdit')}">
                        <button
                            class="btn rounded-0 btn-outline-danger"
                            data-pe-group-dismiss
                            type="button"
                            title="{f:translate(key: 'profileEditing.actions.clear', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'profileEditing.actions.clear', extensionName: 'AcademicPersonsEdit')}">
                            <span aria-hidden="true" class="fs-5 lh-1"
                                ><core:icon
                                    identifier="academic-persons-edit-clear"
                                    size="small"
                                    alternativeMarkupIdentifier="inline"
                            /></span>
                        </button>
                        <button
                            class="btn rounded-0 btn-outline-secondary"
                            data-pe-group-cancel
                            type="button"
                            title="{f:translate(key: 'actions.undo', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.undo', extensionName: 'AcademicPersonsEdit')}">
                            <span aria-hidden="true" class="fs-5 lh-1"
                                ><core:icon
                                    identifier="academic-persons-edit-undo"
                                    size="small"
                                    alternativeMarkupIdentifier="inline"
                            /></span>
                        </button>
                        <button
                            class="btn rounded-0 btn-success"
                            data-pe-group-save
                            type="button"
                            title="{f:translate(key: 'actions.save', extensionName: 'AcademicPersonsEdit')}"
                            aria-label="{f:translate(key: 'actions.save', extensionName: 'AcademicPersonsEdit')}">
                            <span aria-hidden="true" class="fs-5 lh-1"
                                ><core:icon
                                    identifier="academic-persons-edit-save"
                                    size="small"
                                    alternativeMarkupIdentifier="inline"
                            /></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
