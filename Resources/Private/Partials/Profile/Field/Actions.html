<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div
        class="ace-actions btn-group btn-group-sm"
        data-pe-field-actions
        data-pe-for="{elementId}"
        role="group"
        hidden="hidden"
        aria-label="{f:translate(key: 'profileEditing.actions.group', extensionName: 'AcademicPersonsEdit')}">
        <button
            class="ace-control ace-clear btn btn-outline-danger"
            data-pe-dismiss
            data-pe-for="{elementId}"
            type="button"
            title="{f:translate(key: 'profileEditing.actions.clear', extensionName: 'AcademicPersonsEdit')}"
            aria-label="{f:translate(key: 'profileEditing.actions.clear', extensionName: 'AcademicPersonsEdit')}">
            <span aria-hidden="true" class="ace-button-label">
                <ab:icon
                    identifier="tx-academicbase-action-clear"
                    size="small"
                    alternativeMarkupIdentifier="inline" />
            </span>
        </button>
        <button
            class="ace-control ace-undo btn btn-outline-secondary"
            data-pe-cancel
            data-pe-for="{elementId}"
            type="button"
            title="{f:translate(key: 'actions.undo', extensionName: 'AcademicPersonsEdit')}"
            aria-label="{f:translate(key: 'actions.undo', extensionName: 'AcademicPersonsEdit')}">
            <span aria-hidden="true" class="ace-button-label">
                <ab:icon
                    identifier="tx-academicbase-action-undo"
                    size="small"
                    alternativeMarkupIdentifier="inline" />
            </span>
        </button>
        <button
            class="ace-control ace-save btn btn-success"
            data-pe-save
            data-pe-for="{elementId}"
            type="button"
            title="{f:translate(key: 'actions.save', extensionName: 'AcademicPersonsEdit')}"
            aria-label="{f:translate(key: 'actions.save', extensionName: 'AcademicPersonsEdit')}">
            <span aria-hidden="true" class="ace-button-label">
                <ab:icon
                    identifier="tx-academicbase-action-save"
                    size="small"
                    alternativeMarkupIdentifier="inline" />
            </span>
        </button>
    </div>
</html>
