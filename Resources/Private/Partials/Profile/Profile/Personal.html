<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <section class="ace-section"
        aria-labelledby="profile-editing-{profile.uid}-personal-heading"
        data-profile-section="{section.identifier}">
        <h2
            id="profile-editing-{profile.uid}-personal-heading"
            class="ace-title">
            <f:translate
                key="profileEditing.section.personal"
                extensionName="AcademicPersonsEdit" />
        </h2>
        <form
            id="profile-editing-{profile.uid}-personal-form"
            class="ace-form"
            data-pe-fields-form>
            <fieldset class="ace-fieldset">
                <legend class="visually-hidden">
                    <f:translate
                        key="profileEditing.section.personal"
                        extensionName="AcademicPersonsEdit" />
                </legend>
                <div class="row">
                    <f:render
                        partial="Profile/Profile/Fields"
                        arguments="{
                            profile: profile,
                            items: section.items,
                            fieldOptions: fieldOptions,
                            sectionLabel: '{f:translate(key: \'profileEditing.section.personal\', extensionName: \'AcademicPersonsEdit\')}'
                        }" />
                </div>
            </fieldset>
        </form>
    </section>
</html>
