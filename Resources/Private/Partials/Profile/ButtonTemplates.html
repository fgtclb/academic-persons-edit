<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <template data-pe-edit-button-template>
        <button
            class="ace-control ace-edit btn btn-outline-dark btn-sm"
            data-academic-persons-profile-editing-activate-btn
            data-pe-for=""
            type="button"
            aria-controls=""
            aria-expanded="false"
            title="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}"
            aria-label="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}">
            <span data-pe-button-label></span>
        </button>
    </template>
    <template data-pe-new-button-template>
        <button
            class="ace-control ace-edit btn btn-outline-success btn-sm"
            data-academic-persons-profile-editing-activate-btn
            data-pe-for=""
            type="button"
            aria-controls=""
            aria-expanded="false"
            title="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}"
            aria-label="{f:translate(key: 'actions.edit', extensionName: 'AcademicPersonsEdit')}">
            <span data-pe-button-label class="ace-button-label">
                <ab:icon
                    identifier="tx-academicbase-action-edit"
                    size="small"
                    alternativeMarkupIdentifier="inline" />
            </span>
        </button>
    </template>
</html>
