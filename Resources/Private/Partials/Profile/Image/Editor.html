<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <!--
        The profile image editor.

        The server renders the Extbase form in the image editor target because
        only it can provide the upload's "__trustedProperties" signature. The
        custom element updates its closed, idle initial state in the browser.
    -->
    <academic-persons-edit-image-editor>
        <section
            id="profile-editing-{profile.uid}-image-view"
            class="ace-image-editor"
            aria-busy="false"
            hidden="hidden"
            data-pe-image-view-container>
            <div class="ace-content">
                <f:form
                    action="uploadImage"
                    controller="Profile"
                    pageType="1733735"
                    name="profile"
                    object="{profile}"
                    enctype="multipart/form-data"
                    class="ace-form"
                    data-pe-image-form="true">
                    <div class="ace-header">
                        <h2
                            class="ace-title"
                            tabindex="-1"
                            data-pe-image-editor-heading>
                            <f:translate
                                key="profileEditing.image.editor.title"
                                extensionName="AcademicPersonsEdit" />
                        </h2>
                        <div
                            class="ace-actions"
                            data-pe-image-delete-actions>
                            <button
                                class="ace-control ace-delete btn btn-danger"
                                type="button"
                                data-pe-delete-image
                                title="{f:translate(key: 'profileEditing.image.editor.deleteHint', extensionName: 'AcademicPersonsEdit')}">
                                <f:translate
                                    key="actions.delete"
                                    extensionName="AcademicPersonsEdit" />
                            </button>
                            <span
                                class="ace-message"
                                hidden="hidden"
                                data-pe-delete-image-confirm-question>
                                <f:translate
                                    key="profileEditing.image.editor.deleteConfirm"
                                    extensionName="AcademicPersonsEdit" />
                            </span>
                            <button
                                class="ace-control ace-cancel btn btn-outline-secondary"
                                type="button"
                                hidden="hidden"
                                data-pe-cancel-delete-image>
                                <f:translate
                                    key="actions.cancel"
                                    extensionName="AcademicPersonsEdit" />
                            </button>
                            <button
                                class="ace-control ace-delete btn btn-danger"
                                type="button"
                                hidden="hidden"
                                data-pe-confirm-delete-image
                                title="{f:translate(key: 'profileEditing.image.editor.deleteHint', extensionName: 'AcademicPersonsEdit')}">
                                <f:translate
                                    key="actions.delete"
                                    extensionName="AcademicPersonsEdit" />
                            </button>
                        </div>
                    </div>

                    <fieldset data-pe-image-fieldset>
                        <div class="ace-preview" data-pe-image-view-preview>
                            <div
                                class="ace-image-cropper"
                                hidden="hidden"
                                data-pe-image-cropper-stage>
                                <img alt="" data-pe-image-cropper-source />
                            </div>
                            <img
                                class="ace-image"
                                alt=""
                                hidden="hidden"
                                data-pe-image-selected-preview />
                        </div>
                        <p class="ace-helptext">
                            <f:translate
                                key="profileEditing.image.editor.hint.select"
                                extensionName="AcademicPersonsEdit" />
                        </p>
                        <f:if condition="{image.renderType} == 'cropper'">
                            <p class="ace-helptext">
                                <f:translate
                                    key="profileEditing.image.editor.hint.ratio"
                                    extensionName="AcademicPersonsEdit" />:
                                <strong>{image.settings.ratio}</strong>
                            </p>
                        </f:if>
                        <label
                            class="ace-label"
                            for="profile-editing-{profile.uid}-image">
                            <f:translate
                                key="profileEditing.image.upload.label"
                                extensionName="AcademicPersonsEdit" />
                        </label>
                        <div>
                            <f:form.upload
                                property="image"
                                id="profile-editing-{profile.uid}-image"
                                class="ace-control ace-upload"
                                data-pe-image-upload-control="true"
                                accept="{imageAllowedMimeTypes}"
                                aria-describedby="profile-editing-{profile.uid}-image-error"
                                aria-invalid="false"
                                required="true" />
                        </div>
                    </fieldset>

                    <div
                        id="profile-editing-{profile.uid}-image-error"
                        class="ace-message ace-error"
                        role="alert"
                        hidden="hidden"
                        data-pe-image-error></div>

                    <div class="ace-actions">
                        <button
                            class="ace-control ace-cancel btn btn-outline-secondary"
                            type="button"
                            data-pe-close-image-view>
                            <f:translate
                                key="actions.cancel"
                                extensionName="AcademicPersonsEdit" />
                        </button>
                        <button
                            class="ace-control ace-save btn btn-primary"
                            type="submit"
                            disabled="disabled"
                            data-pe-upload-image>
                            <span
                                class="ace-spinner"
                                aria-hidden="true"
                                hidden="hidden"
                                data-pe-image-upload-spinner></span>
                            <f:translate
                                key="actions.save"
                                extensionName="AcademicPersonsEdit" />
                        </button>
                    </div>
                </f:form>
            </div>
        </section>
    </academic-persons-edit-image-editor>
</html>
