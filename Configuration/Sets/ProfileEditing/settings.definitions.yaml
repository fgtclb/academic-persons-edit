# The site settings this component reads.
#
# `Configuration/TypoScript/ProfileEditing/setup.typoscript` assigns
# `settings.detailPid` from `{$plugin.tx_academicpersons.detailPid}`, so the
# profile list can link to the public detail page. The definition of that path
# lives with the aggregate set of EXT:academic_persons, and a site that includes
# the editing component alone does not depend on it - without the definition here
# the constant is never substituted and the link is rendered with the literal
# placeholder as its page uid.
#
# The default has to stay `0`, the value
# `EXT:academic_persons/Configuration/Sets/Full/settings.definitions.yaml` and
# `EXT:academic_persons/Configuration/TypoScript/Default/constants.typoscript`
# declare: a site including both sets reads whichever definition is merged last,
# and a differing default would silently reset what the integrator configured.
#
# `plugin.tx_academicpersonsedit.assets.js` is this extension's own, also assigned in
# `Configuration/TypoScript/ProfileEditing/constants.typoscript` with the same
# default: a site that uses the site set and the static template reads the constants
# after the site settings, so a differing default resets what the integrator
# configured, silently.
categories:
  academic:
    label: 'Academic'
  academic.persons:
    label: 'Persons'
    parent: academic

settings:
  plugin.tx_academicpersons.detailPid:
    label: 'Detail page'
    category: academic.persons
    type: int
    default: 0
  plugin.tx_academicpersonsedit.assets.js:
    label: 'Profile editing | Load the script'
    description: 'Off for an installation that brings its own script. Without one the editor does nothing: every field, button and dialog of it is driven by the script.'
    category: academic.persons
    type: bool
    default: true
