# A site package that takes the mutating actions away from the Contract
# section without setting `readonly`, which is the shape the shipped
# documentation calls "read-only rows with an editable Contract": `view` is
# the only listed action, so no row may be edited, deleted or moved - and
# `readonly` stays false, so a Contract itself can still be created.
#
# The settings files merge recursively, so this names the one list it changes.
# `actions` is a list and is replaced as a whole; the label, the fields and the
# three contact sections of the shipped `contracts` map stay untouched, which
# is why the create of `theListedActionIsStillCarriedOut()` posts every field
# academic_persons requires of a physical address - a required field added
# upstream has to be added to that payload with it.
contracts:
  actions:
    - view
